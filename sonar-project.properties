# SonarQube Cloud: app mobile (Expo / React Native). Análise disparada pelo ci.yml.
# Organização e chave precisam ser exatamente as criadas no SonarQube Cloud
# (passo a passo em Documentos/10-git-flow/MANUAL.md §4.4).
sonar.organization=devpointinnovations
sonar.projectKey=devpointinnovations_radar-saude-mobile
sonar.projectName=Pulseira Verde - Mobile

# A organização devpointinnovations usa o escopo novo do Sonar: sonar.sources é ignorado e
# o projeto inteiro é analisado. O recorte do código do produto passa a ser feito aqui.
sonar.inclusions=src/**,App.js
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**
sonar.exclusions=src/**/__tests__/**

# Mesmo recorte do collectCoverageFrom do jest.config.js: estilo e tema não têm
# teste a cobrar. O gerador do ícone (assets/icon-src) é script de máquina, rodado à mão.
sonar.coverage.exclusions=src/**/css/**,src/theme/**,assets/icon-src/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
